name: Bug report
description: Report a reproducible parser, safety, data, or interface defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, addresses, voice recordings, or real household telemetry.
  - type: textarea
    id: command
    attributes:
      label: Reproduction command
      description: Use synthetic or redacted text only.
      placeholder: 把客厅灯亮度调到50%
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Python and package version

